name: Build Mehedi IPTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project
        run: |
          echo "=== Project Root ==="
          ls -la
          echo "=== App Folder ==="
          ls -la app
          echo "=== Gradle Version ==="
          gradle --version

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          echo "=== APK Files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mehedi-IPTV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
